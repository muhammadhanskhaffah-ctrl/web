name: sistem-kinerja-karyawan

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${LOCAL_APP_PORT:-8080}:8080"
    environment:
      APP_NAME: "Sistem Kinerja Karyawan"
      APP_ENV: local
      APP_KEY: "${APP_KEY:-base64:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LTEyMzQ1Njc4OTA=}"
      APP_DEBUG: "true"
      APP_URL: "http://localhost:${LOCAL_APP_PORT:-8080}"
      APP_TIMEZONE: Asia/Jakarta
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: "${LOCAL_DB_DATABASE:-laravel}"
      DB_USERNAME: "${LOCAL_DB_USERNAME:-laravel}"
      DB_PASSWORD: "${LOCAL_DB_PASSWORD:-laravel}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${LOCAL_DB_DATABASE:-laravel}"
      MYSQL_USER: "${LOCAL_DB_USERNAME:-laravel}"
      MYSQL_PASSWORD: "${LOCAL_DB_PASSWORD:-laravel}"
      MYSQL_ROOT_PASSWORD: "${LOCAL_DB_ROOT_PASSWORD:-root}"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  app-storage:
  mysql-data:
